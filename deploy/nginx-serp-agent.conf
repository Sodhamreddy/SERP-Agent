# nginx site config for SERP Agent.
# Put at /etc/nginx/sites-available/serp-agent, symlink into sites-enabled,
# replace your-domain.com, then run `certbot --nginx` to add HTTPS.

server {
    listen 80;
    server_name your-domain.com;

    # CSV keyword uploads
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:7030;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Critical for SSE / live chat + scan progress streaming ---
        proxy_buffering            off;
        proxy_cache                off;
        proxy_http_version         1.1;
        proxy_set_header Connection "";
        proxy_read_timeout         3600s;
        chunked_transfer_encoding  on;
    }
}
